<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101827" />
    <title>Cesium · ArcGIS 自定义原点</title>
  </head>
  <body>
    <div id="globe"></div>
    <aside class="panel">
      <div class="eyebrow">CESIUM / DIRECT TILE PROVIDER</div>
      <h1>自定义原点，原图直载</h1>
      <p>原点 <code>(−400, 400)</code> · 经纬度缓存 · 无图片合成</p>
      <form id="service-form">
        <label for="service-url">ArcGIS MapServer 地址</label>
        <div class="input-row"><input id="service-url" value="/mock/MapServer" spellcheck="false" /><button type="submit">加载</button></div>
      </form>
      <div class="buttons"><button id="view-china">覆盖范围</button><button id="view-world">全球</button><button id="mode-3d">3D</button><button id="mode-2d">2D</button></div>
      <div id="status" role="status">正在初始化…</div>
      <dl><div><dt>源网格</dt><dd id="grid-info">—</dd></div><div><dt>已请求源瓦片</dt><dd id="request-count">0</dd></div></dl>
      <p class="note">默认使用本地诊断缓存：颜色编码经纬度，深色线条是源瓦片边界。服务图片逐张直接显示；真实服务需要允许浏览器跨域访问。</p>
    </aside>
    <script type="module" src="/demo/main.js"></script>
  </body>
</html>
